[project]
name = "maps2026"
version = "0.1.0"
description = "2026 contributions to 30 Day Map Challenge"
readme = "README.md"
authors = [
    { name = "Nicola Rennie", email = "42338476+nrennie@users.noreply.github.com" }
]
requires-python = ">=3.13"
dependencies = [
    "geopandas>=1.2.0",
    "pandas>=3.0.6",
    "plotnine>=0.15.8",
    "pyproj<3.8",
]

[project.scripts]
day27 = "maps2026:day_27"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"
